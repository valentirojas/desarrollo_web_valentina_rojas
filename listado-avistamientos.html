<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar avistamientos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Consultar avistamientos</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="registro-voluntario.html">Registrar voluntario</a></li>
      <li><a href="registrar-avistamiento.html">Registrar avistamiento</a></li>
      <li><a href="listado-avistamientos.html">Consultar avistamientos</a></li>
      <li><a href="indicadores.html">Indicadores</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Filtros y ordenamiento</h2>

      <label for="filtro-tipo">Tipo de ave</label>
      <select id="filtro-tipo">
        <option value="">Todos</option>
        <option value="rapaz">Rapaz</option>
        <option value="acuatica">Acuática</option>
        <option value="terrestre">Terrestre</option>
        <option value="marina">Marina</option>
      </select>

      <label for="orden">Ordenar por</label>
      <select id="orden">
        <option value="fecha-reciente">Fecha: más reciente</option>
        <option value="fecha-antigua">Fecha: más antigua</option>
        <option value="lugar-az">Lugar: A-Z</option>
        <option value="lugar-za">Lugar: Z-A</option>
      </select>
    </section>

    <section>
      <h2>Avistamientos registrados</h2>

      <p id="cantidad-resultados"></p>

      <div id="lista-avistamientos">
      </div>

      <nav class="paginacion" aria-label="Paginación de avistamientos">
        <button type="button" id="anterior">Anterior</button>
        <span id="pagina-actual">Página 1</span>
        <button type="button" id="siguiente">Siguiente</button>
      </nav>
    </section>
  </main>

  <footer>
    <p>CC5002 - Desarrollo de Aplicaciones Web</p>
  </footer>

  <script src="js/listado.js"></script>

</body>
</html>
